name: Theory Universe Validation

on:
  push:
    paths:
      - 'theory/**'
      - 'empirical/**'
      - 'universe/**'
      - 'thesis/**'
      - 'scripts/**'
      - 'graphify-out/WORLDLINE_REPORT.md'
      - 'graphify-out/DISSERTATION_REPORT.md'
      - 'graphify-out/THESIS_WORKSPACE_REPORT.md'
      - 'README.md'
      - '.github/workflows/theory-universe-validation.yml'
  pull_request:
    paths:
      - 'theory/**'
      - 'empirical/**'
      - 'universe/**'
      - 'thesis/**'
      - 'scripts/**'
      - 'graphify-out/WORLDLINE_REPORT.md'
      - 'graphify-out/DISSERTATION_REPORT.md'
      - 'graphify-out/THESIS_WORKSPACE_REPORT.md'
      - 'README.md'
      - '.github/workflows/theory-universe-validation.yml'
  workflow_dispatch:

concurrency:
  group: theory-universe-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-theory-universe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile theory, empirical, and meta-registry modules
        run: python -m compileall -q theory empirical scripts

      - name: Validate type system
        run: python theory/validate_core.py

      - name: Validate theorem dependency graph
        run: python theory/validate_theory_graph.py

      - name: Verify TU-1 contract revision
        run: python theory/verify_tu1.py

      - name: Verify TU-2 learning versus licensing
        run: python theory/verify_tu2.py

      - name: Verify TU-3 loss-state invariance
        run: python theory/verify_tu3.py

      - name: Verify TU-4 warning state and portability
        run: python theory/verify_tu4.py

      - name: Verify frozen v0.5 semantic core
        run: python theory/validate_freeze.py

      - name: Validate v0.5.1 semantic clarification
        run: python theory/validate_clarification_v0_5_1.py

      - name: Verify v0.6 contract-indexed quotient transport draft
        run: python theory/verify_contract_indexed_quotient_transport.py

      - name: Validate v0.6 pairwise contradiction certificate
        run: python theory/validate_contradiction_matrix.py

      - name: Validate v0.6 triadic screen and bounded witnesses
        run: python theory/validate_triadic_screen.py

      - name: Validate revision reserve and positive bridge registry
        run: python theory/validate_revision_and_positive_bridge.py

      - name: Verify positive RACH-MRM-CED bridge
        run: python theory/bridges/verify_rach_mrm_ced_bridge.py

      - name: Validate empirical projection admission gate
        run: python theory/validate_empirical_projection.py

      - name: Validate Concrete Research Universe
        run: python empirical/validate_empirical_universe.py

      - name: Validate Reality-to-Theory path firewalls
        run: python empirical/validate_reality_theory_graph.py

      - name: Validate task-indexed worldline atlas
        run: python scripts/validate_worldline_atlas.py

      - name: Rebuild Graphify worldline overlay
        run: python scripts/build_worldline_overlay.py /tmp/theouni-worldline-extraction.json

      - name: Check generated worldline report is synchronized
        run: git diff --exit-code -- graphify-out/WORLDLINE_REPORT.md

      - name: Validate preferred dissertation architecture
        run: python scripts/validate_dissertation_architecture.py

      - name: Rebuild Graphify dissertation overlay
        run: python scripts/build_dissertation_overlay.py /tmp/theouni-dissertation-extraction.json

      - name: Check generated dissertation report is synchronized
        run: git diff --exit-code -- graphify-out/DISSERTATION_REPORT.md

      - name: Validate thesis chapter workspace
        run: python scripts/validate_thesis_workspace.py

      - name: Validate forbidden-inference verification recovery
        run: python scripts/validate_chapter_verification_recovery.py

      - name: Validate theorem-level proved conditions
        run: python scripts/validate_proved_condition_registry.py

      - name: Validate prior-art and priority-claim firewall
        run: python scripts/validate_prior_art_firewall.py

      - name: Validate citation-ready prior-art references
        run: python scripts/validate_prior_art_reference_registry.py

      - name: Validate typed Chapter 9 synthesis
        run: python scripts/validate_typed_synthesis_matrix.py

      - name: Validate typed chapter question handoffs
        run: python scripts/validate_chapter_transition_recovery.py

      - name: Rebuild thesis workspace report
        run: python scripts/build_thesis_workspace_report.py

      - name: Check generated thesis workspace report is synchronized
        run: git diff --exit-code -- graphify-out/THESIS_WORKSPACE_REPORT.md
