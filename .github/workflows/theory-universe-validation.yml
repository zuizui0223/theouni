name: Theory Universe Validation

on:
  push:
    paths:
      - 'theory/**'
      - 'empirical/**'
      - 'README.md'
      - '.github/workflows/theory-universe-validation.yml'
  pull_request:
    paths:
      - 'theory/**'
      - 'empirical/**'
      - 'README.md'
      - '.github/workflows/theory-universe-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-theory-universe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile theory and empirical modules
        run: python -m compileall -q theory empirical

      - name: Validate type system
        run: python theory/validate_core.py

      - name: Validate theorem dependency graph
        run: python theory/validate_theory_graph.py

      - name: Verify TU-1 contract revision
        run: python theory/verify_tu1.py

      - name: Verify TU-2 learning versus licensing
        run: python theory/verify_tu2.py

      - name: Verify TU-3 loss-state invariance
        run: python theory/verify_tu3.py

      - name: Verify TU-4 warning state and portability
        run: python theory/verify_tu4.py

      - name: Verify frozen v0.5 semantic core
        run: python theory/validate_freeze.py

      - name: Validate v0.5.1 semantic clarification
        run: python theory/validate_clarification_v0_5_1.py

      - name: Verify v0.6 contract-indexed quotient transport draft
        run: python theory/verify_contract_indexed_quotient_transport.py

      - name: Validate revision reserve and positive bridge registry
        run: python theory/validate_revision_and_positive_bridge.py

      - name: Verify positive RACH-MRM-CED bridge
        run: python theory/bridges/verify_rach_mrm_ced_bridge.py

      - name: Validate empirical projection admission gate
        run: python theory/validate_empirical_projection.py

      - name: Validate Concrete Research Universe
        run: python empirical/validate_empirical_universe.py

      - name: Validate Reality-to-Theory path firewalls
        run: python empirical/validate_reality_theory_graph.py
